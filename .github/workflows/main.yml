name: Android CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Script
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      # Kita masuk ke folder android-app dulu sebelum memberi izin
      run: chmod +x android-app/gradlew

    - name: Build with Gradle
      # Gunakan argumen -p (project-dir) untuk menunjuk ke folder android-app
      run: ./android-app/gradlew -p android-app assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        # Sesuaikan path hasil build-nya
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        
