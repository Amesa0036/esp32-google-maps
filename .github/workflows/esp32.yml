name: Build ESP32-C3 Google Maps

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Setup ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Required Libraries
        run: |
          # Library wajib untuk project maisonsmd
          arduino-cli lib install "TFT_eSPI"
          arduino-cli lib install "NimBLE-Arduino"

      - name: Compile for ESP32-C3
        run: |
          # FQBN khusus untuk ESP32-C3 Dev Module
          arduino-cli compile --fqbn esp32:esp32:esp32c3 esp32/ --output-dir ./build_output --verbose

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-maps-firmware
          path: ./build_output/
