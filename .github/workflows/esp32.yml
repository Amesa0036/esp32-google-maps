name: Build ESP32 Firmware

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "${{ github.workspace }}/bin" >> $GITHUB_PATH

      - name: Setup ESP32 Core
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install Libraries
        run: |
          # Tambahkan library eksternal jika ada, contoh:
          arduino-cli lib install "NimBLE-Arduino"
          # arduino-cli lib install "GFX Library for Arduino"
          # Jika UI kamu pakai LVGL, buka tanda pagar di bawah:
          arduino-cli lib install "lvgl"
          echo "Installing libraries..."

      - name: Compile ESP32 Sketch
        run: |
          # Perintah compile mengarah ke folder android-app/esp32
          arduino-cli compile --fqbn esp32:esp32:esp32 android-app/esp32/ --output-dir ./build_output

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: esp32-navigation-firmware
          path: ./build_output/
